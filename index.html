<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bdellbee Genetics</title>
  <meta name="description" content="Interactive genetics modules with gorbies, glubbins and chomnies.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-view="loading">
  <header class="topbar">
    <a class="brand" href="#/">Bdellbee Genetics</a>
    <span class="brand-sub">a lab of gorbies, glubbins and chomnies</span>
    <nav class="crumbs" id="crumbs"></nav>
  </header>

  <main>
    <section id="hub" class="hub">
      <div class="hero">
        <div id="hero-stage" class="hero-stage" aria-label="Three creatures; tap one to reshuffle its traits"></div>
        <div class="hero-copy">
          <h1>Learn inheritance by doing meiosis yourself.</h1>
          <p>Every module is generated fresh: new creatures, new genotypes, new numbers. Work the puzzles, then check your intuition with probability and statistics.</p>
        </div>
      </div>
      <div id="units"></div>
    </section>

    <section id="play" class="play">
      <div id="stage" class="stage"></div>
      <aside id="panel" class="panel"></aside>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.21.0/dist/pixi.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
